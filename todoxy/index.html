<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061117">
<title>Todoxy já pegou Challenger?</title>
<meta name="description" content="A pergunta mais importante do servidor brasileiro: todoxy já pegou challenger?">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--cyan:#63e9ff;--blue:#249cc4;--gold:#d5b45b;--ink:#061117;--panel:rgba(5,18,24,.72);--line:rgba(130,235,255,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03080c;color:#f3fbff;font-family:Inter,system-ui,sans-serif}body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(1,7,10,.28),rgba(1,7,10,.9)),url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Yasuo_0.jpg') center 18%/cover no-repeat;filter:saturate(.75);z-index:-3}
body:after{content:"";position:fixed;inset:-30%;background:repeating-radial-gradient(ellipse at 20% 50%,transparent 0 28px,rgba(78,217,255,.045) 29px 31px,transparent 32px 72px);transform:rotate(-8deg);z-index:-2;animation:wind 18s linear infinite}
@keyframes wind{to{transform:rotate(-8deg) translateX(140px)}}
.wrap{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 32px;position:relative}.wrap:before,.wrap:after{content:"";position:fixed;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.3;filter:blur(.5px);animation:slash 5s ease-in-out infinite}.wrap:before{top:28%;transform:rotate(-8deg)}.wrap:after{top:72%;transform:rotate(7deg);animation-delay:1.4s}@keyframes slash{0%,100%{opacity:.08;transform:translateX(-20px) rotate(-8deg)}50%{opacity:.5;transform:translateX(30px) rotate(-8deg)}}
.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#b8dce5}.player{display:flex;align-items:center;gap:9px;background:rgba(1,10,14,.6);border:1px solid var(--line);padding:10px 13px;border-radius:999px;backdrop-filter:blur(12px)}.dot{width:7px;height:7px;border-radius:50%;background:#4cff9d;box-shadow:0 0 15px #4cff9d}.refresh{border:1px solid var(--line);background:rgba(1,10,14,.55);color:#c8edf3;padding:10px 13px;border-radius:999px;font:inherit;letter-spacing:.08em;cursor:pointer}.refresh:hover{border-color:rgba(99,233,255,.55);color:#fff}
.hero{width:min(940px,100%);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 0 32px}.eyebrow{font-size:clamp(13px,2vw,17px);font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:#b8e9f2;text-shadow:0 2px 22px #000;margin-bottom:4px}.question{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(42px,8vw,86px);letter-spacing:.02em;line-height:.9;margin:0;text-shadow:0 8px 35px #000}.answer{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(150px,34vw,380px);line-height:.72;margin:22px 0 30px;letter-spacing:-.035em;color:#fff;text-shadow:0 0 2px #fff,0 0 20px rgba(61,208,255,.35),0 12px 50px #000;position:relative}.answer:after{content:"";position:absolute;left:4%;right:4%;bottom:-12px;height:4px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 22px var(--cyan);transform:skewX(-35deg)}.answer.yes{color:#fff7d1;text-shadow:0 0 3px #fff,0 0 28px #d5b45b,0 12px 50px #000}.answer.error{font-size:clamp(78px,20vw,210px);color:#d9e7eb}
.status{width:min(660px,100%);display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px}.card{background:linear-gradient(180deg,rgba(6,24,31,.84),rgba(3,13,18,.78));border:1px solid var(--line);border-radius:18px;padding:15px 17px;backdrop-filter:blur(14px);box-shadow:0 18px 70px rgba(0,0,0,.22);text-align:left}.label{font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:#7da9b4;margin-bottom:6px}.value{font-size:19px;font-weight:850}.value.gold{color:#e4c66c}.small{font-size:12px;color:#8eb2ba;margin-top:4px}.gap{margin-top:11px;color:#badde4;font-size:13px}.gap strong{color:#fff}.quote{margin-top:20px;color:#b9d4da;font-style:italic;font-size:13px;text-shadow:0 2px 10px #000}.source{margin-top:18px;font-size:10px;letter-spacing:.07em;color:#72939b}.source a{color:#8fc9d5;text-decoration:none}.loading{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.confetti{position:fixed;z-index:30;pointer-events:none;font-size:22px;animation:fly 2.7s ease-out forwards}@keyframes fly{0%{opacity:0;transform:translateY(20px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-90vh) rotate(720deg)}}
@media(max-width:600px){.wrap{padding:18px 12px 24px}.hero{padding-top:42px}.status{grid-template-columns:1fr 1fr}.status .card:first-child{grid-column:1/-1}.top{font-size:10px}.refresh{padding:9px 10px}.answer{margin-top:18px;margin-bottom:27px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="player"><span class="dot"></span><span>xyd#zzzzz · BR</span></div>
    <button class="refresh" id="refresh">↻ atualizar</button>
  </header>
  <section class="hero">
    <div class="eyebrow">a pergunta que assombra o high elo brasileiro</div>
    <h1 class="question">todoxy já pegou challenger?</h1>
    <div class="answer loading" id="answer">...</div>
    <div class="status" id="status">
      <div class="card"><div class="label">rank atual</div><div class="value loading" id="rank">consultando o servidor...</div><div class="small" id="wl"></div></div>
      <div class="card"><div class="label">lp</div><div class="value gold loading" id="lp">—</div><div class="small">Solo/Duo</div></div>
      <div class="card"><div class="label">status</div><div class="value loading" id="cutoff">—</div><div class="small">BR agora</div></div>
    </div>
    <div class="gap" id="gap">O vento está consultando os dados...</div>
    <div class="quote" id="quote">“A morte é como o vento... está sempre ao meu lado.” — o mano do 0/10 powerspike</div>
    <div class="source" id="source"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let timer;
const profileUrl='https://www.leagueofgraphs.com/summoner/br/xyd-zzzzz';
function fmt(n){return Number.isFinite(Number(n))?Number(n).toLocaleString('pt-BR'):'—'}
function cleanLoading(){document.querySelectorAll('.loading').forEach(x=>x.classList.remove('loading'))}
function confetti(){for(let i=0;i<55;i++){let x=document.createElement('div');x.className='confetti';x.textContent=['⚔️','🌪️','✨','🏆','💙'][Math.floor(Math.random()*5)];x.style.left=Math.random()*100+'vw';x.style.top=(85+Math.random()*12)+'vh';x.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),3700)}}
function parseProfile(text){const plain=text.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();const tierMatch=plain.match(/\b(Challenger|GrandMaster|Grandmaster|Master|Diamond|Emerald|Platinum|Gold|Silver|Bronze|Iron)\b\s*(?:[IVX]+\s*)?([0-9][0-9.,]*)\s*LP/i);if(!tierMatch)throw new Error('não achei o rank na página');let tier=tierMatch[1];if(/^grandmaster$/i.test(tier))tier='GrandMaster';const lp=Number(tierMatch[2].replace(/\./g,'').replace(',','.'));const winsMatch=plain.match(/(?:Wins|Vitórias|Vitorias|Zaferler)\s*:?\s*(\d+)/i);const lossesMatch=plain.match(/(?:Losses|Derrotas|Kayıplar|Kayiplar)\s*:?\s*(\d+)/i);const wins=winsMatch?Number(winsMatch[1]):null;const losses=lossesMatch?Number(lossesMatch[1]):null;const winrate=(wins!=null&&losses!=null&&wins+losses>0)?Math.round(wins/(wins+losses)*100):null;return{tier,lp,wins,losses,winrate}}
async function fetchPublicProfile(){const urls=['https://api.allorigins.win/raw?disableCache=true&url='+encodeURIComponent(profileUrl),'https://r.jina.ai/http://'+profileUrl.replace(/^https?:\/\//,'')];let lastErr;for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return parseProfile(t)}catch(e){lastErr=e}}throw lastErr||new Error('fontes indisponíveis')}
async function load(){clearTimeout(timer);$('refresh').disabled=true;$('refresh').textContent='↻ checando...';try{const rr=await fetchPublicProfile();const challenger=/^challenger$/i.test(rr.tier);cleanLoading();$('answer').textContent=challenger?'SIM':'NÃO';$('answer').className='answer'+(challenger?' yes':'');$('rank').textContent=rr.tier||'—';$('lp').textContent=fmt(rr.lp)+' LP';$('cutoff').textContent=challenger?'PEGOU 🏆':'AINDA NÃO';$('wl').textContent=(rr.wins!=null&&rr.losses!=null)?`${rr.wins}V · ${rr.losses}D${rr.winrate!=null?' · '+rr.winrate+'% WR':''}`:'vitórias/derrotas indisponíveis';if(challenger){$('gap').innerHTML='<strong>ACABOU A PIADA.</strong> O desgraçado conseguiu. 🏆';$('quote').textContent='O 0/10 powerspike finalmente transcendeu.';confetti()}else{$('gap').innerHTML=`<strong>${rr.tier} ${fmt(rr.lp)} LP.</strong> Portanto: NÃO. Continua no tornado.`;$('quote').textContent='“A morte é como o vento... está sempre ao meu lado.” — enquanto o Challenger não vem'}$('source').innerHTML=`checado ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · dados: <a href="${profileUrl}" target="_blank" rel="noreferrer">LeagueOfGraphs</a> · atualiza sozinho a cada 60s`}catch(e){cleanLoading();$('answer').textContent='NÃO*';$('answer').className='answer error';$('rank').textContent='fonte temporariamente indisponível';$('lp').textContent='—';$('cutoff').textContent='—';$('gap').innerHTML='<strong>*O site não conseguiu consultar o rank agora.</strong> Tenta atualizar daqui a pouco.';$('source').textContent=String(e.message||e)}finally{$('refresh').disabled=false;$('refresh').textContent='↻ atualizar';timer=setTimeout(load,60000)}}
$('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
