<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1015">
<title>Todoxy já pegou Challenger?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#0b1015;--panel:#111820;--line:#293441;--text:#f4f6f8;--muted:#8d9aa7;--blue:#5383e8;--red:#e84057;--green:#34c985;--gold:#e0bd5e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1015;color:var(--text);font-family:Inter,system-ui,sans-serif}body{background:linear-gradient(90deg,rgba(11,16,21,.97),rgba(11,16,21,.82)),url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Yasuo_0.jpg') center 22%/cover fixed no-repeat}.app{min-height:100svh}header{height:62px;background:rgba(17,24,32,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.bar,main{width:min(1040px,calc(100% - 28px));margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px}.brand{font-weight:800}.live{color:var(--muted)}main{padding:42px 0 28px}.profile{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.identity{display:flex;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:13px;background:url('https://ddragon.leagueoflegends.com/cdn/15.16.1/img/champion/Yasuo.png') center/cover;border:1px solid var(--line)}.name{font-size:23px;font-weight:800}.tag,.region{color:var(--muted)}.tag{font-size:14px;margin-left:4px}.region{font-size:12px;margin-top:5px}button{border:1px solid #385ca8;background:var(--blue);color:white;font:inherit;font-size:13px;font-weight:700;padding:10px 14px;border-radius:7px;cursor:pointer}.question{background:rgba(17,24,32,.97);border:1px solid var(--line);border-radius:10px;overflow:hidden}.qhead{padding:16px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:#c7d0d9}.qbody{text-align:center;padding:52px 20px 48px;background:linear-gradient(180deg,rgba(21,29,38,.91),rgba(17,24,32,.98))}h1{font-size:clamp(30px,5vw,48px);margin:0;font-weight:800;letter-spacing:-.045em}.answer{font-size:clamp(125px,28vw,285px);line-height:.82;font-weight:900;letter-spacing:-.075em;color:var(--red);margin:28px 0 15px}.answer.yes{color:var(--green)}.sub{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px;margin-top:14px}.card{background:rgba(17,24,32,.97);border:1px solid var(--line);border-radius:10px;padding:18px;min-height:120px}.ct{font-size:12px;font-weight:700;color:#98a6b3;margin-bottom:13px}.big{font-size:24px;font-weight:800}.gold{color:var(--gold)}.small{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}.pill{display:inline-block;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:800;background:rgba(232,64,87,.13);color:#ff7d90}.pill.yes{background:rgba(52,201,133,.14);color:#66e6aa}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#71808d;font-size:11px;padding:15px 4px}.meta a{color:#8fa8cd;text-decoration:none}footer{text-align:center;padding:18px 16px 28px;color:#86939f;font-size:12px}@media(max-width:700px){main{padding-top:24px}.grid{grid-template-columns:1fr}.avatar{width:50px;height:50px}.qbody{padding:40px 12px}.answer{font-size:clamp(115px,40vw,190px)}}
</style></head>
<body><div class="app"><header><div class="bar"><div class="brand">CHALLENGER CHECK</div><div class="live">xyd#zzzzz · BR</div></div></header>
<main><section class="profile"><div class="identity"><div class="avatar"></div><div><div class="name">xyd<span class="tag">#zzzzz</span></div><div class="region">Brasil · Solo/Duo</div></div></div><button id="refresh">Atualizar</button></section>
<section class="question"><div class="qhead">STATUS DO OBJETIVO</div><div class="qbody"><h1>todoxy já pegou challenger?</h1><div class="answer" id="answer">...</div><div class="sub" id="answerSub">carregando dados</div></div></section>
<section class="grid"><div class="card"><div class="ct">RANK ATUAL</div><div class="big" id="rank">—</div><div class="small" id="wl">Solo/Duo · BR</div></div><div class="card"><div class="ct">PONTOS DE LIGA</div><div class="big gold" id="lp">—</div><div class="small">Dados atualizados pelo servidor.</div></div><div class="card"><div class="ct">CHALLENGER</div><div class="pill" id="pill">—</div><div class="small" id="statusText">Carregando.</div></div></section>
<div class="meta"><span id="updated">Última atualização: —</span><span id="source">Fonte: —</span></div></main><footer>feito com amor e carinho byungchan</footer></div>
<script>
const $=id=>document.getElementById(id);let timer;
function fmt(n){return Number.isFinite(Number(n))?Number(n).toLocaleString('pt-BR'):'—'}
function dateBR(s){if(!s)return '—';try{return new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})}catch{return s}}
async function load(){clearTimeout(timer);$('refresh').disabled=true;$('refresh').textContent='Atualizando...';try{const r=await fetch('./rank.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const c=!!d.challenger||String(d.tier).toLowerCase()==='challenger';$('answer').textContent=c?'SIM':'NÃO';$('answer').className='answer'+(c?' yes':'');$('answerSub').textContent=c?'A conta alcançou Challenger.':'A conta ainda não está em Challenger.';$('rank').textContent=d.tier||'Indisponível';$('lp').textContent=d.lp==null?'—':fmt(d.lp)+' LP';if(d.wins!=null&&d.losses!=null){$('wl').textContent=`${d.wins} vitórias · ${d.losses} derrotas${d.winrate!=null?' · '+d.winrate+'% WR':''}`}else{$('wl').textContent='Solo/Duo · BR'}$('pill').textContent=c?'SIM':'NÃO';$('pill').className='pill'+(c?' yes':'');$('statusText').textContent=c?'Objetivo concluído.':'Objetivo ainda não concluído.';$('updated').textContent='Última atualização: '+dateBR(d.updated_at||d.checked_at);$('source').textContent='Fonte: '+(d.source||'cache público')+(d.status==='stale'?' · último dado válido':'')}catch(e){$('answer').textContent='NÃO';$('answerSub').textContent='Usando o último estado disponível.';$('rank').textContent='Aguardando atualização';$('lp').textContent='—';$('pill').textContent='NÃO';$('statusText').textContent='O cache ainda não foi carregado.';$('source').textContent='Erro: '+e.message}finally{$('refresh').disabled=false;$('refresh').textContent='Atualizar';timer=setTimeout(load,60000)}}
$('refresh').onclick=load;load();
</script></body></html>
