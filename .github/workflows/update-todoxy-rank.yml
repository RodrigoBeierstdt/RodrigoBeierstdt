name: Update Todoxy rank

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'todoxy/fetch_rank.py'
      - '.github/workflows/update-todoxy-rank.yml'

permissions:
  contents: write

concurrency:
  group: todoxy-rank
  cancel-in-progress: true

jobs:
  update-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current rank
        run: python todoxy/fetch_rank.py
      - name: Commit updated rank
        run: |
          git config user.name "todoxy-rank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add todoxy/rank.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Atualiza rank do Todoxy"
            git push
          fi
